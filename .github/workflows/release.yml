name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Package macOS app (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          tar -czf "MoFA-Stage-macos-x64.tar.gz" -C mac-x64 "MoFA Stage.app"
          tar -czf "MoFA-Stage-macos-arm64.tar.gz" -C mac-arm64 "MoFA Stage.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
